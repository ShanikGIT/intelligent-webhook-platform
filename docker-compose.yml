services:
  postgres:
    image: postgres:17
    container_name: webhook-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: webhook_platform
      POSTGRES_USER: webhook_user
      POSTGRES_PASSWORD: webhook_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: